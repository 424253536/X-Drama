# v12.226(CI 加固 · 企业采购门槛 · 🟠-17)
# 依赖自动跟进:每周拉一次补丁/小版本 PR,把「零安全跟进」变成有节奏的例行维护。
# 大版本(major)刻意不自动开 PR —— Next/React 这类升级要人工评估破坏面。
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      # 开发依赖打包成一个 PR,减少噪音
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      # 生产依赖的补丁级也合并,安全补丁优先单独出 PR(dependabot 默认行为)
      prod-patches:
        dependency-type: production
        update-types: [patch]
    ignore:
      # major 升级人工评估:Next 16 / React 19 的破坏面需要逐版验证
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
