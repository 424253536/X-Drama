<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'Noto Sans SC'; font-weight: 400; font-display: block; src: url('assets/fonts/noto-chinese-simplified-400.woff2') format('woff2'); }
      @font-face { font-family: 'Noto Sans SC'; font-weight: 700; font-display: block; src: url('assets/fonts/noto-chinese-simplified-700.woff2') format('woff2'); }
      @font-face { font-family: 'Noto Sans SC'; font-weight: 900; font-display: block; src: url('assets/fonts/noto-chinese-simplified-900.woff2') format('woff2'); }
      @font-face { font-family: 'Inter'; font-weight: 600; font-display: block; src: url('assets/fonts/inter-600.woff2') format('woff2'); }
      @font-face { font-family: 'Inter'; font-weight: 800; font-display: block; src: url('assets/fonts/inter-800.woff2') format('woff2'); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #08080c; }
      body { font-family: "Noto Sans SC", "Inter", sans-serif; color: #fff; }
      .clip { position: absolute; inset: 0; }
      .center { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; text-align: center; }
      .gold { color: #E8C547; }
      .muted { color: #9aa0ac; }

      /* ---------- footage scenes ---------- */
      video.bg-vid { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .grade { position: absolute; inset: 0; pointer-events: none;
        background:
          linear-gradient(to top, rgba(8,8,12,0.92) 0%, rgba(8,8,12,0.35) 30%, rgba(8,8,12,0) 58%),
          radial-gradient(120% 90% at 50% 42%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.55) 100%);
      }
      .grade-gold { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: soft-light;
        background: radial-gradient(90% 70% at 50% 60%, rgba(232,197,71,0.18) 0%, rgba(232,197,71,0) 70%); }
      .dip { position: absolute; inset: 0; background: #06060a; }
      .topbar { position: absolute; top: 64px; left: 80px; right: 80px; display: flex; justify-content: space-between; align-items: center; }
      .topbar .mark { font-family: "Inter", sans-serif; font-weight: 700; letter-spacing: 6px; font-size: 22px; color: rgba(255,255,255,0.82); }
      .topbar .reg { font-family: "Inter", sans-serif; font-weight: 600; letter-spacing: 3px; font-size: 18px; color: #E8C547; }
      .lower { position: absolute; left: 90px; bottom: 120px; max-width: 1300px; }
      .lower .bar { width: 64px; height: 5px; background: #E8C547; border-radius: 3px; margin-bottom: 28px; }
      .lower .big { font-weight: 900; font-size: 116px; line-height: 1.04; text-shadow: 0 6px 40px rgba(0,0,0,0.6); }

      /* ---------- graphic scenes ---------- */
      .gbg { background: radial-gradient(1200px 700px at 50% 38%, #1a1726 0%, #0d0c14 55%, #08080c 100%); }
      .gbg .glow { position: absolute; width: 900px; height: 900px; left: 510px; top: 90px; border-radius: 50%;
        background: radial-gradient(circle, rgba(232,197,71,0.16) 0%, rgba(232,197,71,0) 70%); filter: blur(8px); }
      .gbg .grain { position: absolute; inset: 0; opacity: 0.05;
        background-image: radial-gradient(rgba(255,255,255,0.4) 1px, transparent 1px); background-size: 4px 4px; }

      .t-cn { font-weight: 900; font-size: 200px; letter-spacing: 10px; line-height: 1; text-shadow: 0 8px 40px rgba(0,0,0,0.5); }
      .t-en { font-family: "Inter", sans-serif; font-weight: 800; font-size: 46px; letter-spacing: 22px; margin-top: 22px; }
      .t-bar { width: 0; height: 5px; background: #E8C547; margin: 40px auto 26px; border-radius: 3px; }
      .t-tag { font-size: 52px; font-weight: 500; }

      .kicker { font-family: "Inter", sans-serif; font-weight: 700; letter-spacing: 8px; font-size: 30px; color: #E8C547; }
      .big { font-weight: 900; font-size: 150px; line-height: 1.05; margin: 18px 0 50px; }
      .chips { display: flex; gap: 26px; }
      .chip { font-size: 40px; font-weight: 700; padding: 22px 44px; border: 2px solid rgba(232,197,71,0.45);
        border-radius: 999px; background: rgba(232,197,71,0.07); }

      .wall-cap { font-size: 64px; font-weight: 900; margin-bottom: 36px; }
      .grid { display: grid; grid-template-columns: repeat(4, 360px); grid-template-rows: repeat(2, 304px); gap: 22px; }
      .grid .cell { width: 360px; height: 304px; border-radius: 16px; overflow: hidden; border: 1px solid rgba(255,255,255,0.10); position: relative; }
      .grid .cell img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .grid .cell .lbl { position: absolute; left: 14px; bottom: 12px; font-family: "Inter", sans-serif; font-weight: 700;
        font-size: 19px; letter-spacing: 1px; color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,0.9); }

      .feat { font-weight: 900; font-size: 100px; line-height: 1.18; }
      .feat .num { font-family: "Inter", sans-serif; color: #E8C547; margin-right: 28px; }

      .cta-main { font-weight: 900; font-size: 116px; line-height: 1.12; }
      .cta-brand { margin-top: 44px; font-size: 50px; font-weight: 700; }
      .cta-pill { margin-top: 40px; font-family: "Inter", sans-serif; font-weight: 800; font-size: 34px; letter-spacing: 4px;
        color: #08080c; background: #E8C547; padding: 22px 56px; border-radius: 999px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="38.9" data-width="1920" data-height="1080">

      <!-- ════════ Scene 1 · 冷开场 双城之战(Vi)实拍 (0 - 3.6) ════════ -->
      <video id="vid-vi" class="bg-vid" data-start="0" data-duration="3.6" data-media-start="1.5" data-track-index="0"
        src="assets/footage-vi.mp4" muted playsinline></video>
      <div id="f1" class="clip" data-start="0" data-duration="3.6" data-track-index="1">
        <div class="grade"></div><div class="grade-gold"></div>
        <div class="topbar"><div class="mark f1mark">WIND&nbsp;COMIC</div><div class="reg f1reg">AI · SHORT-DRAMA STUDIO</div></div>
        <div class="lower">
          <div class="bar f1bar"></div>
          <div class="big f1big">一句话,<br/>一部<span class="gold">短剧</span>。</div>
        </div>
        <div class="dip f1dip"></div>
      </div>

      <!-- ════════ Scene 2 · 片头 Title (3.6 - 8.2) ════════ -->
      <div id="s1" class="clip gbg" data-start="3.6" data-duration="4.6" data-track-index="2">
        <div class="glow"></div><div class="grain"></div>
        <div class="center">
          <div class="t-cn">青枫漫剧</div>
          <div class="t-en">W I N D &nbsp; C O M I C</div>
          <div class="t-bar" id="s1bar"></div>
          <div class="t-tag muted">AI 短剧制作台 <span class="gold">·</span> 不止生成</div>
        </div>
      </div>

      <!-- ════════ Scene 3 · 不止生成 (8.2 - 14.2) ════════ -->
      <div id="s2" class="clip gbg" data-start="8.2" data-duration="6.0" data-track-index="2">
        <div class="glow"></div><div class="grain"></div>
        <div class="center">
          <div class="kicker s2k">从一句话到成片</div>
          <div class="big">不止<span class="gold">生成</span></div>
          <div class="chips">
            <div class="chip s2c">节奏审计</div>
            <div class="chip s2c">质量门禁</div>
            <div class="chip s2c">角色锁脸</div>
          </div>
        </div>
      </div>

      <!-- ════════ Scene 4 · 双城之战(Jinx)实拍 — 角色一致 (14.2 - 18.1) ════════ -->
      <video id="vid-jinx" class="bg-vid" data-start="14.2" data-duration="3.9" data-media-start="5.3" data-track-index="0"
        src="assets/footage-jinx.mp4" muted playsinline></video>
      <div id="f2" class="clip" data-start="14.2" data-duration="3.9" data-track-index="1">
        <div class="grade"></div><div class="grade-gold"></div>
        <div class="lower">
          <div class="bar f2bar"></div>
          <div class="big f2big">同一个主角,<br/><span class="gold">跨镜跨集</span>不漂移。</div>
        </div>
        <div class="dip f2dip"></div>
      </div>

      <!-- ════════ Scene 5 · 画风墙 (18.1 - 23.7) ════════ -->
      <div id="s3" class="clip gbg" data-start="18.1" data-duration="5.6" data-track-index="2">
        <div class="glow"></div><div class="grain"></div>
        <div class="center">
          <div class="wall-cap"><span class="gold">30+</span> 画风任选 · 全片一致</div>
          <div class="grid">
            <div class="cell wcell"><img src="assets/cyberpunk.jpg" /><div class="lbl">赛博朋克</div></div>
            <div class="cell wcell"><img src="assets/makoto-shinkai.jpg" /><div class="lbl">新海诚</div></div>
            <div class="cell wcell"><img src="assets/american-comic.jpg" /><div class="lbl">美漫</div></div>
            <div class="cell wcell"><img src="assets/shounen.jpg" /><div class="lbl">热血番</div></div>
            <div class="cell wcell"><img src="assets/mihoyo-game.jpg" /><div class="lbl">米哈游</div></div>
            <div class="cell wcell"><img src="assets/gothic.jpg" /><div class="lbl">哥特</div></div>
            <div class="cell wcell"><img src="assets/vaporwave.jpg" /><div class="lbl">蒸汽波</div></div>
            <div class="cell wcell"><img src="assets/ink-wash.jpg" /><div class="lbl">水墨</div></div>
          </div>
        </div>
      </div>

      <!-- ════════ Scene 6 · 双城之战(Zaun)实拍 — 横竖屏 (23.7 - 28.1) ════════ -->
      <video id="vid-zaun" class="bg-vid" data-start="23.7" data-duration="4.4" data-media-start="0.3" data-track-index="0"
        src="assets/footage-zaun.mp4" muted playsinline></video>
      <div id="f3" class="clip" data-start="23.7" data-duration="4.4" data-track-index="1">
        <div class="grade"></div><div class="grade-gold"></div>
        <div class="lower">
          <div class="bar f3bar"></div>
          <div class="big f3big">横屏 · 竖屏<br/>一键<span class="gold">双版本</span>。</div>
        </div>
        <div class="dip f3dip"></div>
      </div>

      <!-- ════════ Scene 7 · 三大能力 (28.1 - 33.3) ════════ -->
      <div id="s4" class="clip gbg" data-start="28.1" data-duration="5.2" data-track-index="2">
        <div class="glow"></div><div class="grain"></div>
        <div class="center" style="align-items:flex-start; padding-left:300px;">
          <div class="feat f"><span class="num">01</span>横竖屏双版本 · 一键出片</div>
          <div class="feat f"><span class="num">02</span>多集系列 · 跨集主角一致</div>
          <div class="feat f"><span class="num">03</span>持久队列 · 自动批量成片</div>
        </div>
      </div>

      <!-- ════════ Scene 8 · CTA (33.3 - 38.9) ════════ -->
      <div id="s5" class="clip gbg" data-start="33.3" data-duration="5.6" data-track-index="3">
        <div class="glow"></div><div class="grain"></div>
        <div class="center">
          <div class="cta-main">一句话,<br/>生成你的<span class="gold">第一部短剧</span></div>
          <div class="cta-brand">青枫漫剧 <span class="muted">· Wind Comic</span></div>
          <div class="cta-pill" id="s5pill">START CREATING</div>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // 每个场景 [start, end] — narration-driven(跟英文旁白时长)
      const F1 = [0.0, 3.6], S1 = [3.6, 8.2], S2 = [8.2, 14.2], F2 = [14.2, 18.1],
            S3 = [18.1, 23.7], F3 = [23.7, 28.1], S4 = [28.1, 33.3], S5 = [33.3, 38.9];

      // helper:实拍场景的入场/出场「闪黑」+ 文字进出
      function footage(sel, win, opts) {
        const [a, b] = win;
        tl.fromTo(`${sel} .dip`, { opacity: 1 }, { opacity: 0, duration: 0.45, ease: "power2.out" }, a)
          .to(`${sel} .dip`, { opacity: 1, duration: 0.3, ease: "power2.in" }, b - 0.3);
        tl.from(`${sel} .grade`, { opacity: 0, duration: 0.5 }, a);
        tl.from(`${sel} .bar`, { scaleX: 0, transformOrigin: "left", duration: 0.5, ease: "power2.out" }, a + 0.35)
          .from(`${sel} .big`, { opacity: 0, y: 40, duration: 0.7, ease: "power3.out" }, a + 0.5)
          .to(`${sel} .big`, { opacity: 0, y: -20, duration: 0.3 }, b - 0.45);
        if (opts && opts.top) {
          tl.from(`${sel} .mark`, { opacity: 0, y: -14, duration: 0.5 }, a + 0.3)
            .from(`${sel} .reg`, { opacity: 0, y: -14, duration: 0.5 }, a + 0.45);
        }
      }

      // S1 footage (Vi · cold open)
      footage("#f1", F1, { top: true });

      // Scene 2 · Title
      tl.from("#s1 .t-cn", { opacity: 0, y: 70, scale: 0.92, duration: 0.9, ease: "power3.out" }, S1[0] + 0.15)
        .from("#s1 .t-en", { opacity: 0, y: 20, duration: 0.6 }, S1[0] + 0.7)
        .to("#s1bar", { width: 360, duration: 0.6, ease: "power2.out" }, S1[0] + 0.95)
        .from("#s1 .t-tag", { opacity: 0, y: 20, duration: 0.6 }, S1[0] + 1.15)
        .to("#s1 .center", { opacity: 0, y: -28, duration: 0.45 }, S1[1] - 0.55).set("#s1 .center", { opacity: 0 }, S1[1]);

      // Scene 3 · 不止生成
      tl.from("#s2 .s2k", { opacity: 0, y: 24, duration: 0.55 }, S2[0] + 0.2)
        .from("#s2 .big", { opacity: 0, y: 40, scale: 0.95, duration: 0.75, ease: "power3.out" }, S2[0] + 0.4)
        .from("#s2 .s2c", { opacity: 0, y: 36, duration: 0.55, stagger: 0.15, ease: "back.out(1.6)" }, S2[0] + 1.05)
        .to("#s2 .center", { opacity: 0, y: -28, duration: 0.45 }, S2[1] - 0.55).set("#s2 .center", { opacity: 0 }, S2[1]);

      // S4 footage (Jinx · 角色一致)
      footage("#f2", F2);

      // Scene 5 · 画风墙
      tl.from("#s3 .wall-cap", { opacity: 0, y: 28, duration: 0.55 }, S3[0] + 0.2)
        .from("#s3 .wcell", { opacity: 0, scale: 0.55, duration: 0.55, stagger: 0.07, ease: "back.out(1.5)" }, S3[0] + 0.45)
        .to("#s3 .center", { opacity: 0, scale: 0.97, duration: 0.45 }, S3[1] - 0.55).set("#s3 .center", { opacity: 0 }, S3[1]);

      // S6 footage (Zaun · 横竖屏)
      footage("#f3", F3);

      // Scene 7 · 三大能力
      tl.from("#s4 .f", { opacity: 0, x: -80, duration: 0.65, stagger: 0.28, ease: "power3.out" }, S4[0] + 0.2)
        .to("#s4 .center", { opacity: 0, y: -28, duration: 0.45 }, S4[1] - 0.55).set("#s4 .center", { opacity: 0 }, S4[1]);

      // Scene 8 · CTA
      tl.from("#s5 .cta-main", { opacity: 0, y: 50, scale: 0.95, duration: 0.85, ease: "power3.out" }, S5[0] + 0.3)
        .from("#s5 .cta-brand", { opacity: 0, y: 20, duration: 0.55 }, S5[0] + 1.0)
        .from("#s5pill", { opacity: 0, scale: 0.8, duration: 0.55, ease: "back.out(1.8)" }, S5[0] + 1.4)
        .to("#s5pill", { boxShadow: "0 0 36px rgba(232,197,71,0.7)", duration: 0.6, yoyo: true, repeat: 3 }, S5[0] + 2.1);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
